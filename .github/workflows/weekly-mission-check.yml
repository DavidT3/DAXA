name: Weekly mission instance definition checks

on:
  schedule:
    - cron: '10 12 * * 1'   # every Monday 15:40 EST
  workflow_dispatch:        # Make sure we can trigger manually as well

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .[test]   # adjust extras/install method as needed

      - name: Run non-telescope unit tests
        run: |
          python -m unittest discover -s tests/test_missions -p "test_declare_missions.py" -v
